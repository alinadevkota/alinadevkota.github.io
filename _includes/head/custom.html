<!-- Publication detail pages. The citation block is emitted by
     _layouts/single.html with an inline "font-size: smaller" style, and only
     documents with a citation: field produce it, so this effectively scopes to
     publication pages. -->
<style>
  /* The theme's HTML5 reset sets display:block on article, aside, section and
     friends. That is an author rule, and the [hidden] rule it fights lives only
     in the UA stylesheet, so an author declaration wins no matter the
     specificity - any <article hidden> kept rendering. Restore the intent. */
  [hidden] {
    display: none !important;
  }

  .page__content h2 {
    margin-top: 1.4em;
    margin-bottom: 0.5em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid var(--global-border-color);
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .page__content p[style*="smaller"] {
    margin-top: 1.8em;
    padding: 0.9em 1.1em;
    background: rgba(128, 128, 128, 0.08);
    border-left: 3px solid var(--global-link-color);
    border-radius: 3px;
    font-size: 0.85em !important;
    line-height: 1.6;
  }

  .page__content p[style*="smaller"] a {
    font-weight: 600;
  }

  /* --- Footer -------------------------------------------------------
     The theme paints footer text with --global-text-color-light (#bdc1c4),
     which is 1.63:1 on the #f2f3f3 footer - unreadable. These values are
     5.4:1 light / 6.0:1 dark. It also uppercases every item, which mangles
     the email address, so only the small labels keep that treatment. */
  .page__footer {
    color: #5e6469;
  }

  html[data-theme="dark"] .page__footer {
    color: #c4c9cd;
  }

  .page__footer-follow ul.social-icons {
    margin: 0 0 0.35em;
  }

  .page__footer-follow li {
    margin-right: 1.1em;
    font-size: 0.8em;
    text-transform: none;              /* was uppercase on every item */
    color: #5e6469;
  }

  html[data-theme="dark"] .page__footer-follow li {
    color: #c4c9cd;
  }

  /* Only the "Follow:" / "Contact:" labels stay in small caps. */
  .page__footer-follow .footer-label {
    display: inline-block;
    min-width: 5.2em;
    font-size: 0.92em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .page__footer-follow a {
    color: #5e6469;
    text-decoration: none;
  }

  html[data-theme="dark"] .page__footer-follow a {
    color: #c4c9cd;
  }

  .page__footer-follow a:hover {
    color: var(--global-link-color);
    text-decoration: underline;
  }

  /* Addresses are case-insensitive, but uppercasing one reads as shouting. */
  .page__footer-follow .footer-email {
    text-transform: none;
  }

  .page__footer-copyright {
    margin-top: 0.9em;
    font-size: 0.72em;
    line-height: 1.7;
    color: #6a7075;
  }

  html[data-theme="dark"] .page__footer-copyright {
    color: #b4b9bd;
  }

  .page__footer-copyright a {
    color: inherit;
    text-decoration: underline;
  }

  .page__footer-copyright a:hover {
    color: var(--global-link-color);
  }

  /* Previous / Next pager. The theme colors the label with
     --global-text-color-light, which is #bcc0c4 in light mode - only 1.83:1 on
     white, so the buttons were barely visible. Border was #dfe1e3 for the same
     reason. Applies site-wide, not just to paper pages. */
  .pagination--cards {
    display: flex;
    flex-wrap: wrap;
    gap: 0.9em;
    margin-top: 1.5em;
  }

  /* Overrides the theme's float/50%/centered pager. */
  .pagination--cards .pagination--pager {
    flex: 0 1 calc(50% - 0.45em);
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    float: none;
    width: auto;
    padding: 0.85em 1.15em;
    text-align: left;
    text-decoration: none;
    color: var(--global-text-color);
    border: 1px solid #8b9197;             /* 3.18:1 on white */
    border-radius: 6px;
    transition: border-color 0.15s ease, background-color 0.15s ease,
                transform 0.15s ease, box-shadow 0.15s ease;
  }

  html[data-theme="dark"] .pagination--cards .pagination--pager {
    border-color: #8f949a;                 /* 3.04:1 on #474747 */
  }

  /* A lone "Next" (first paper in the list) stays on the right. */
  .pagination--cards .pager--next {
    margin-left: auto;
    text-align: right;
    align-items: flex-end;
  }

  .pagination--cards .pager__label {
    display: block;
    font-size: 0.7em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #696f75;
  }

  html[data-theme="dark"] .pagination--cards .pager__label {
    color: #bcc0c4;
  }

  .pagination--cards .pager--prev .pager__label::before {
    content: "\2190";                      /* left arrow */
    display: inline-block;
    margin-right: 0.45em;
    transition: transform 0.15s ease;
  }

  .pagination--cards .pager--next .pager__label::after {
    content: "\2192";                      /* right arrow */
    display: inline-block;
    margin-left: 0.45em;
    transition: transform 0.15s ease;
  }

  /* Two lines max, so the two cards stay the same height. */
  .pagination--cards .pager__title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.9em;
    font-weight: 600;
    line-height: 1.4;
    color: var(--global-text-color);
  }

  .pagination--cards .pagination--pager:hover {
    background: rgba(128, 128, 128, 0.09);
    border-color: var(--global-link-color);
    transform: translateY(-2px);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    text-decoration: none;
  }

  .pagination--cards .pagination--pager:hover .pager__title {
    color: var(--global-link-color);
  }

  .pagination--cards .pager--prev:hover .pager__label::before {
    transform: translateX(-3px);
  }

  .pagination--cards .pager--next:hover .pager__label::after {
    transform: translateX(3px);
  }

  @media (max-width: 600px) {
    .pagination--cards .pagination--pager {
      flex: 1 1 100%;
    }
  }

  /* Paper pages carry no profile sidebar, so reclaim the columns the theme
     reserves for it. Theme default is width 83.05% + 16.95% right padding,
     which would otherwise leave the gutter empty. $large is 925px. */
  @media screen and (min-width: 925px) {
    .page--wide {
      width: 100%;
      padding-left: 0;
      padding-right: 0;
    }
  }

  /* --- Publication page header: authors, venue, action links --- */

  .page__content .pub-authors {
    margin: 0 0 0.3em;
    font-size: 0.95em;
    line-height: 1.55;
    color: #696f75;
  }

  .page__content .pub-authors strong {
    font-weight: 700;
    color: var(--global-text-color);
  }

  .page__content .pub-venue {
    margin: 0 0 1em;
    font-size: 0.95em;
    font-style: italic;
    color: #696f75;
  }

  html[data-theme="dark"] .page__content .pub-authors,
  html[data-theme="dark"] .page__content .pub-venue {
    color: #bcc0c4;
  }

  .page__content .pub-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    margin: 0 0 1.6em;
  }

  .page__content .pub-actions a {
    padding: 0.3em 1em;
    background: rgba(128, 128, 128, 0.1);
    border: 1px solid var(--global-dark-border-color);
    border-radius: 3px;
    font-size: 0.85em;
    font-weight: 600;
    text-decoration: none;
    color: var(--global-link-color);
  }

  .page__content .pub-actions a:hover {
    border-color: var(--global-link-color);
    text-decoration: none;
  }

  /* --- Abstract + teaser layout ---------------------------------------
     The figure comes first in the source so it can be floated; without a video
     the flex column reorders it back below the abstract. With a video the
     container becomes a block, the figure floats right, and the abstract wraps
     beside it and then reflows to full width once it clears the image. */
  .pub-body {
    display: flex;
    flex-direction: column;
  }

  .pub-body .pub-body__text { order: 1; }
  .pub-body .pub-teaser     { order: 2; }
  /* Without a video the column is reordered, so the extra figures have to
     be pushed past the lead one as well as past the abstract. */
  .pub-body .pub-teaser--rest { order: 3; }

  .pub-body__text > h2:first-child {
    margin-top: 0;
  }

  /* Justified abstract. Hyphenation is enabled alongside it: justifying without
     it opens large word gaps, worst in the ~370px lines that run beside a
     floated figure. The theme sets lang="en" on <html>, which hyphens needs. */
  .pub-body__text p {
    text-align: justify;
    -webkit-hyphens: auto;
    hyphens: auto;
  }

  @media (min-width: 800px) {
    .pub-body--split {
      display: block;                  /* float needs a block container */
    }

    .pub-body--split::after {
      content: "";
      display: block;
      clear: both;                     /* keep the video clear of the float */
    }

    .pub-body--split .pub-teaser--lead {
      float: right;
      /* Wider than the grid version could afford: because the text reflows to
         full width below the figure, only the first few lines are narrowed. */
      width: 27em;
      margin: 0.3em 0 1.1em 1.8em;
    }

    .pub-body--split .pub-teaser--lead img {
      width: 100%;
      max-height: none;
    }

    .pub-body--split .pub-teaser--sm {
      width: 20em;
    }

    /* Figures after the abstract run full width below the floated one. */
    .pub-body--split .pub-teaser--rest {
      clear: both;
    }

    /* A block box still spans the full width beside a float - only its line
       boxes shrink - so the heading's bottom rule would run under the figure.
       overflow:hidden gives it its own formatting context so it stops short. */
    .pub-body--split .pub-body__text > h2 {
      overflow: hidden;
    }
  }

  /* "coming soon" marker for a paper with no URL yet. Deliberately a <span>,
     not an <a>: it must not look or behave like a link. */
  .page__content .pub-actions__pending,
  .pub__links-pending {
    padding: 0.3em 1em;
    border: 1px dashed var(--global-dark-border-color);
    border-radius: 3px;
    font-size: 0.85em;
    font-weight: 600;
    font-style: italic;
    white-space: nowrap;
    color: #696f75;
  }

  .pub__links-pending {
    padding: 0.16em 0.7em;
    font-size: 0.8em;
  }

  html[data-theme="dark"] .page__content .pub-actions__pending,
  html[data-theme="dark"] .pub__links-pending {
    color: #bcc0c4;
  }

  /* Embedded explainer video on a publication page: player left, note right. */
  .pub-video {
    display: flex;
    flex-wrap: wrap;
    align-items: center;               /* note sits centred against the player */
    gap: 1.4em;
    margin: 0 0 1.8em;
  }

  /* The probe script reveals this block by clearing [hidden]. Because the rule
     above sets display:flex, [hidden] alone would no longer hide it - an author
     display always beats the UA stylesheet - so it is restated here. */
  .pub-video[hidden] {
    display: none;
  }

  .pub-video__player {
    flex: 1 1 24em;
    min-width: 0;
  }

  .pub-video__player video {
    display: block;
    width: 100%;
    background: #000;
    border: 1px solid var(--global-border-color);
    border-radius: 6px;
  }

  .pub-video__note {
    flex: 1 1 12em;
    max-width: 16em;
    padding-left: 1.2em;
    border-left: 2px solid var(--global-border-color);
    font-size: 0.85em;
    line-height: 1.6;
    color: #696f75;
  }

  html[data-theme="dark"] .pub-video__note {
    color: #bcc0c4;
  }

  .pub-video__note p {
    margin: 0 0 0.7em;
  }

  .pub-video__note p:last-child {
    margin-bottom: 0;
  }

  .pub-video__note-label {
    font-size: 0.82em;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--global-text-color);
  }

  .pub-video__note-more {
    font-weight: 600;
    white-space: nowrap;
  }

  .pub-video__note-more::after {
    content: "\2192";
    margin-left: 0.35em;
  }

  /* Below this the note reads better under the player than beside it. */
  @media (max-width: 700px) {
    .pub-video__note {
      max-width: none;
      padding-left: 0;
      padding-top: 0.9em;
      border-left: 0;
      border-top: 2px solid var(--global-border-color);
    }
  }

  /* --- Paper page: index beside the record -----------------------------
     .page__inner-wrap becomes a two-column grid on a paper page. The index
     takes column one and spans every row; everything the theme already put
     in there - header, content, citation, share, pager - is pushed into
     column two without being moved in the markup.
     Existing --global-* custom properties are used throughout, so this
     inherits the site's light and dark palettes rather than adding a new one. */
  @media (min-width: 1024px) {
    .pub-shell {
      display: grid;
      grid-template-columns: 19.5rem minmax(0, 1fr);
      column-gap: 2.2rem;
      align-items: start;
    }

    .pub-shell > *:not(.pubx) {
      grid-column: 2;
      min-width: 0;
    }

    .pubx {
      grid-column: 1;
      /* `1 / -1` would resolve against the explicit grid, which has no rows
         defined, and collapse to a single row - dropping the paper below the
         index instead of beside it. A span comfortably larger than the number
         of siblings keeps the column intact; the surplus rows are empty and
         take no height. */
      grid-row: 1 / span 30;
      /* Follows the reader down a long paper, and scrolls on its own once the
         list is taller than the viewport. */
      position: sticky;
      top: 1.5em;
      max-height: calc(100vh - 3em);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--global-border-color);
      padding-right: 1.1rem;
    }

    .pubx__list {
      overflow-y: auto;
      min-height: 0;
    }
  }

  .pubx {
    margin: 0 0 2.2em;
    font-size: 1em;
  }

  .pubx__head {
    flex: 0 0 auto;
    padding-bottom: 0.7em;
    border-bottom: 1px solid var(--global-border-color);
  }

  .pubx__title {
    margin: 0 0 0.6em;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #696f75;
  }

  html[data-theme="dark"] .pubx__title { color: #bcc0c4; }

  .pubx__count {
    margin-left: 0.4em;
    font-weight: 400;
    opacity: 0.7;
  }

  .pubx__sorts {
    display: flex;
    align-items: center;
    gap: 0.3em;
    flex-wrap: wrap;
  }

  .pubx__label {
    margin: 0 0.15em 0 0;
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #696f75;
    white-space: nowrap;
  }

  html[data-theme="dark"] .pubx__label { color: #bcc0c4; }

  .pubx .pubx__sort {
    padding: 0.36em 0.7em;
    border: 1px solid var(--global-border-color);
    border-radius: 3px;
    background: none;
    /* A button does not inherit the page's font, so without this it fell back
       to the UA default and rendered larger than the titles below it. */
    font-family: inherit;
    font-size: 0.75em;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #696f75;
    cursor: pointer;
  }

  html[data-theme="dark"] .pubx .pubx__sort { color: #bcc0c4; }

  .pubx .pubx__sort:hover {
    border-color: var(--global-link-color);
    color: var(--global-link-color);
  }

  .pubx .pubx__sort[aria-pressed="true"] {
    background: var(--global-text-color);
    border-color: var(--global-text-color);
    color: var(--global-bg-color);
  }

  .pubx__search { display: block; }

  /* The theme has no utility for this, and the filter's label must stay in the
     accessibility tree while being invisible. */
  .u-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .pubx__filter {
    width: 100%;
    margin-top: 0.55em;
    padding: 0.45em 0.6em;
    border: 1px solid var(--global-border-color);
    border-radius: 3px;
    background: var(--global-bg-color);
    color: var(--global-text-color);
    font-size: 0.8em;
    font-family: inherit;
  }

  .pubx__filter:focus {
    outline: none;
    border-color: var(--global-link-color);
  }

  .pubx__grp {
    margin: 0;
    padding: 1em 0 0.4em;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #696f75;
  }

  html[data-theme="dark"] .pubx__grp { color: #bcc0c4; }

  .pubx__item {
    display: block;
    padding: 0.6em 0.7em 0.65em;
    border-bottom: 1px solid var(--global-border-color);
    /* The 3px marker is drawn for every row so nothing shifts when the
       current paper changes. */
    border-left: 3px solid transparent;
    text-decoration: none;
    color: var(--global-text-color);
  }

  /* A neutral translucent tint rather than --global-code-background-color:
     that variable is #fafafa in the dark theme as well as the light one, so
     the themed text colour lands on a near-white box and disappears. Grey at
     low alpha darkens a light background and lightens a dark one. */
  .pubx__item:hover {
    background: rgba(128, 128, 128, 0.09);
    text-decoration: none;
  }

  .pubx__item.is-current {
    border-left-color: var(--global-link-color);
    background: rgba(128, 128, 128, 0.16);
  }

  .pubx__t {
    display: block;
    font-size: 0.89em;
    font-weight: 500;
    line-height: 1.4;
  }

  /* The current paper is marked by the accent bar and the tint alone. Bolding
     the title as well made it wider, so entries re-wrapped as you moved
     between papers and the whole list shifted under the pointer. */

  .pubx__m {
    display: flex;
    align-items: center;
    gap: 0.5em;
    margin-top: 0.32em;
    font-size: 0.75em;
    color: #696f75;
  }

  html[data-theme="dark"] .pubx__m { color: #bcc0c4; }

  .pubx__v {
    font-weight: 600;
    color: var(--global-link-color);
  }

  .pubx__dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }

  /* --- Previous / next, matched to the index pane --------------------- */
  .pub-pager {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.9rem;
    margin: 2.2em 0 0;
    padding-top: 1.4em;
    border-top: 1px solid var(--global-border-color);
  }

  .pub-pager__link {
    display: block;
    padding: 0.85em 1em;
    border: 1px solid var(--global-border-color);
    border-radius: 4px;
    text-decoration: none;
    color: var(--global-text-color);
  }

  .pub-pager__link:hover {
    border-color: var(--global-link-color);
    background: rgba(128, 128, 128, 0.07);
    text-decoration: none;
  }

  /* The right-hand card reads right-aligned so the pair mirrors. */
  .pub-pager__next { text-align: right; }

  .pub-pager__label {
    display: block;
    margin-bottom: 0.3em;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #696f75;
  }

  html[data-theme="dark"] .pub-pager__label { color: #bcc0c4; }

  .pub-pager__prev .pub-pager__label::before { content: "\2190\00a0"; }
  .pub-pager__next .pub-pager__label::after  { content: "\00a0\2192"; }

  .pub-pager__title {
    display: block;
    font-size: 0.89em;
    font-weight: 500;
    line-height: 1.4;
  }

  .pub-pager__meta {
    display: flex;
    align-items: center;
    gap: 0.5em;
    margin-top: 0.35em;
    font-size: 0.75em;
    color: #696f75;
  }

  .pub-pager__next .pub-pager__meta { justify-content: flex-end; }

  html[data-theme="dark"] .pub-pager__meta { color: #bcc0c4; }

  .pub-pager__v { font-weight: 600; color: var(--global-link-color); }

  .pub-pager__dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }

  .pub-pager a:focus:not(:focus-visible) { outline: none; }

  @media (max-width: 600px) {
    .pub-pager { grid-template-columns: 1fr; }
    .pub-pager__next { text-align: left; }
    .pub-pager__next .pub-pager__meta { justify-content: flex-start; }
    .pub-pager__next .pub-pager__label::after { content: "\00a0\2192"; }
  }

  /* The theme rings focused links with 5px of $warning-color (#f89406) via
     a:focus - not :focus-visible - so a mouse click leaves an orange box
     behind. Drop it for pointer focus, keep it for keyboard users, and give
     them a ring that matches the rest of the page. */
  .pubx a:focus:not(:focus-visible),
  .pubx button:focus:not(:focus-visible),
  .pubx input:focus:not(:focus-visible) {
    outline: none;
  }

  .pubx a:focus-visible,
  .pubx button:focus-visible,
  .pubx input:focus-visible {
    outline: 2px solid var(--global-link-color);
    outline-offset: -2px;
  }

  /* The swapped-in record takes focus so keyboard and screen-reader users
     land on the new paper rather than at the top of the document; it is not
     an interactive control, so it draws no ring. */
  /* Applies to every page now that soft navigation focuses the new heading,
