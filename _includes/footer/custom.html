<!-- Paper videos: reveal only the ones actually present in the Paper2Video
     repo. Elements are rendered hidden with data-video-probe="<url>"; one HEAD
     request per distinct URL decides. Pages serves these with
     access-control-allow-origin: *, so the cross-origin check is allowed.
     If JS is off or a request fails, nothing is shown rather than a dead
     player or a 404 link. -->
<script>
(function () {
  var seen = {};
  /* Exposed so it can run again over markup swapped in after load. Results
     are cached per URL, so revisiting a paper costs no extra requests. */
  window.probeVideos = function (root) {
    var nodes = (root || document).querySelectorAll('[data-video-probe]');
    if (!nodes.length || !window.fetch) return;
    Array.prototype.forEach.call(nodes, function (el) {
      var url = el.getAttribute('data-video-probe');
      if (!url) return;
      if (!seen[url]) {
        seen[url] = fetch(url, { method: 'HEAD' })
          .then(function (r) { return r.ok; })
          .catch(function () { return false; });
      }
      seen[url].then(function (ok) { if (ok) { el.hidden = false; } });
    });
  };
  window.probeVideos(document);
})();
</script>

<script>
/* How papers are grouped and ordered, shared by the index pane on a paper
   page and the publications list, so the two can never drift apart. Both
   render the same data-* attributes; only the markup around them differs.

   NOTE: block comments only in this file. compress_html collapses each
   inline script onto one line in the production build, so a // comment
   would silently disable everything after it. */
window.PUBSORT = {
  date: {
    key: function (el) { return el.dataset.year; },
    cmp: function (a, b) { return b.dataset.date.localeCompare(a.dataset.date); }
  },
  venue: {
    key: function (el) { return el.dataset.venuetype; },
    cmp: function (a, b) {
      return (a.dataset.venueorder - b.dataset.venueorder)
          || b.dataset.date.localeCompare(a.dataset.date);
    }
  },
  topic: {
    key: function (el) { return el.dataset.topic; },
    cmp: function (a, b) {
      /* Group order comes from _data/topics.yml, not the alphabet. */
      return (a.dataset.topicorder - b.dataset.topicorder)
          || a.dataset.topic.localeCompare(b.dataset.topic)
          || b.dataset.date.localeCompare(a.dataset.date);
    }
  }
};
</script>
<script>
/* Paper-page index: regroup and filter.

   Progressive enhancement only. Liquid has already rendered every paper as a
   real link grouped by year; this re-sorts those same nodes and inserts new
   group headings. With JavaScript off the index still lists everything, in
   date order, with the current paper marked.

   Exposed as window.pubxInit so it can be wired again after soft navigation
   brings in a fresh pane. */
(function () {
  function init() {
    var list = document.getElementById('pubx-list');
    if (!list || list.dataset.wired) return;
    list.dataset.wired = '1';

    var aside  = list.closest('.pubx');
    var empty  = aside.querySelector('.pubx__empty');
    var sorts  = aside.querySelectorAll('.pubx__sort');
    var filter = aside.querySelector('.pubx__filter');
    var items  = Array.prototype.slice.call(list.querySelectorAll('.pubx__item'));

    var MODES = window.PUBSORT;

    function draw(mode, needle) {
      var m = MODES[mode] || MODES.date;
      var shown = items.filter(function (el) {
        return !needle || el.dataset.find.indexOf(needle) !== -1;
      }).sort(m.cmp);

      var frag = document.createDocumentFragment(), group = null;
      shown.forEach(function (el) {
        var k = m.key(el);
        if (k !== group) {
          group = k;
          var h = document.createElement('p');
          h.className = 'pubx__grp';
          h.textContent = k;
          frag.appendChild(h);
        }
        frag.appendChild(el);
      });

      list.textContent = '';
      list.appendChild(frag);
      empty.hidden = shown.length > 0;
    }

    aside.addEventListener('click', function (e) {
      var b = e.target.closest('.pubx__sort');
      if (!b) return;
      Array.prototype.forEach.call(sorts, function (s) {
        s.setAttribute('aria-pressed', String(s === b));
      });
      draw(b.dataset.sort, filter.value.trim().toLowerCase());
    });

    filter.addEventListener('input', function () {
      var active = aside.querySelector('.pubx__sort[aria-pressed="true"]');
      draw(active ? active.dataset.sort : 'date', this.value.trim().toLowerCase());
    });
  }

  window.pubxInit = init;
  init();
})();
</script>

<script>
/* Soft navigation across the whole site.

   NOTE: use block comments only in this file. compress_html collapses each
   inline script onto one line in the production build, so a // comment
   would silently disable everything after it - the symptom is that soft
   navigation works locally and not on GitHub Pages.

   Every link stays a real <a> to a real, server-rendered URL - that is what
   keeps the pages indexable and shareable. This only intercepts the click,
   fetches the target and swaps the content in, so the masthead, the theme
   switch and (between two paper pages) the index pane keep their state.

   Two modes:
     - paper -> paper: replace everything inside .pub-shell except the index,
       so the pane keeps its scroll position, grouping and filter text.
     - anything else: replace the contents of #main.

   Anything unusual - a modified click, an external link, a file, a failed
   fetch, no History API - falls through to an ordinary navigation. */
(function () {
  var main = document.getElementById('main');
  if (!main || !window.fetch || !window.history || !history.pushState) return;

  var SKIP = /\.(pdf|png|jpe?g|webp|gif|svg|zip|gz|docx?|pptx?|xlsx?|csv|txt|xml|json|ics|bib)$/i;
  var token = 0;

  function restOf(shell) {
    return Array.prototype.filter.call(shell.children, function (el) {
      return !el.classList.contains('pubx');
    });
  }

  function markIndex() {
    var aside = document.querySelector('.pubx');
    if (!aside) return;
    /* Compare resolved paths: the markup carries a root-relative href while
       the live location is absolute, so raw strings never match. */
    var path = location.pathname.replace(/\/$/, '');
    Array.prototype.forEach.call(aside.querySelectorAll('.pubx__item'), function (a) {
      var here = a.pathname.replace(/\/$/, '') === path;
      a.classList.toggle('is-current', here);
      if (here) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  /* The theme binds these once at load, directly to elements inside #main.
     After a swap those elements are gone, so the new ones need wiring. */
  function rebindTheme() {
    if (!window.jQuery) return;
    var $ = window.jQuery;
    $('.author__urls-wrapper button').off('click.soft').on('click.soft', function () {
      $('.author__urls').fadeToggle('fast');
      $('.author__urls-wrapper button').toggleClass('open');
    });
    if ($.fn.smoothScroll) {
      $('#main a').smoothScroll({ offset: -70, preventDefault: false });
    }
  }

  function afterSwap(scope) {
    if (window.probeVideos) window.probeVideos(scope);
    if (window.pubxInit) window.pubxInit();
    if (window.pubListInit) window.pubListInit();
    markIndex();
    rebindTheme();
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([scope]);
    }
    var h = scope.querySelector('.page__title, .archive__subtitle, h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  function swap(url, push) {
    var mine = ++token;
    main.setAttribute('aria-busy', 'true');

    return fetch(url, { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(function (html) {
        if (mine !== token) return;                      /* a later click won */
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var newMain = doc.getElementById('main');
        if (!newMain) throw new Error('no #main');

        if (push) history.pushState({ soft: true }, '', url);
        document.title = doc.title;

        var here = document.querySelector('.pub-shell');
        var there = doc.querySelector('.pub-shell');

        if (here && there) {
          /* Paper to paper: keep the index pane exactly as the reader left it. */
          restOf(here).forEach(function (el) { el.remove(); });
          restOf(there).forEach(function (el) { here.appendChild(el); });
          main.removeAttribute('aria-busy');
          afterSwap(here);
        } else {
          main.innerHTML = newMain.innerHTML;
          main.removeAttribute('aria-busy');
          afterSwap(main);
        }
        window.scrollTo(0, 0);
      })
      .catch(function () {
        if (mine === token) location.href = url;          /* let the browser do it */
      });
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest('a[href]');
    if (!a || a.target || a.hasAttribute('download')) return;
    if (a.origin !== location.origin) return;

    var raw = a.getAttribute('href');
    if (!raw || raw.charAt(0) === '#') return;            /* in-page anchor */
    if (SKIP.test(a.pathname)) return;                    /* a file, not a page */
    if (a.pathname === location.pathname && a.hash) return;

    if (a.pathname.replace(/\/$/, '') === location.pathname.replace(/\/$/, '')) {
      e.preventDefault();                                  /* already here */
      return;
    }
    e.preventDefault();
    swap(a.href, true);
  });

  window.addEventListener('popstate', function (e) {
    if (e.state && e.state.soft) swap(location.href, false);
  });

  /* So the first Back press returns here rather than to the page before. */
  history.replaceState({ soft: true }, '', location.href);
})();
</script>

<script>
/* Publications list: regroup and filter in place.

   The same contract as the index pane - Liquid renders every paper grouped
   by year, and this reorders those same <article> nodes and rewrites the
   headings. Nothing is created or destroyed, so the teaser images, the
   video-probe links and the "Details" links all survive untouched.

   Exposed as window.pubListInit so soft navigation can wire it again after
   bringing the page back.

   NOTE: block comments only - see the note on window.PUBSORT above. */
(function () {
  function init() {
    var list = document.getElementById('publist');
    if (!list || list.dataset.wired) return;
    list.dataset.wired = '1';

    var bar    = document.querySelector('.publist__bar');
    var empty  = document.querySelector('.publist__empty');
    var countN = document.getElementById('publist-n');
    var sorts  = bar.querySelectorAll('.publist__sort');
    var filter = bar.querySelector('.publist__filter');
    var items  = Array.prototype.slice.call(list.querySelectorAll('.pub'));
    var total  = items.length;

    function draw(mode, needle) {
      var m = window.PUBSORT[mode] || window.PUBSORT.date;
      var shown = items.filter(function (el) {
        return !needle || el.dataset.find.indexOf(needle) !== -1;
      }).sort(m.cmp);

      var frag = document.createDocumentFragment(), group = null;
      shown.forEach(function (el) {
        var k = m.key(el);
        if (k !== group) {
          group = k;
          var h = document.createElement('h2');
          h.className = 'pub-year';
          h.textContent = k;
          frag.appendChild(h);
        }
        frag.appendChild(el);
      });

      list.textContent = '';
      list.appendChild(frag);
      /* Lets the cards show their year when the heading no longer carries it. */
      list.dataset.group = (window.PUBSORT[mode] ? mode : 'date');
      empty.hidden = shown.length > 0;
      buildNav(shown, m);
      /* Say "4 of 10" only while a filter is narrowing things. */
      countN.textContent = shown.length === total
        ? total
        : shown.length + ' of ' + total;
    }

    bar.addEventListener('click', function (e) {
      var b = e.target.closest('.publist__sort');
      if (!b) return;
      Array.prototype.forEach.call(sorts, function (s) {
        s.setAttribute('aria-pressed', String(s === b));
      });
      draw(b.dataset.sort, filter.value.trim().toLowerCase());
    });

    filter.addEventListener('input', function () {
      var active = bar.querySelector('.publist__sort[aria-pressed="true"]');
      draw(active ? active.dataset.sort : 'date', this.value.trim().toLowerCase());
    });

    /* --- Reading view ---------------------------------------------------
       Two ways through the same list: short summaries, or the full abstracts
       with an index beside them. The abstract is already in the page, lifted
       from each paper's own body at build time, so switching is instant and
       costs no requests. */
    var shell   = document.getElementById('publist-shell');
    var navList = document.getElementById('publist-nav-list');
    var view    = document.getElementById('pubview');
    var VIEW_KEY = 'pub-view';

    function buildNav(shown, mode) {
      if (!navList) return;
      var frag = document.createDocumentFragment(), group = null;
      shown.forEach(function (card) {
        var k = mode.key(card);
        if (k !== group) {
          group = k;
          var h = document.createElement('p');
          h.className = 'publist__nav-grp';
          h.textContent = k;
          frag.appendChild(h);
        }
        var a = document.createElement('a');
        a.href = '#' + card.id;
        var t = card.querySelector('.pub__title');
        a.textContent = t ? t.textContent.trim() : card.id;
        frag.appendChild(a);
      });
      navList.textContent = '';
      navList.appendChild(frag);
    }

    function setView(v) {
      if (!shell) return;
      shell.dataset.view = v;
      Array.prototype.forEach.call(view.querySelectorAll('.pubview__opt'), function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.view === v));
      });
      try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
    }

    if (view && shell) {
      /* Sit the switch on the same line as the page title. */
      var title = document.querySelector('.page__title');
      if (title && title.parentNode) {
        var row = document.createElement('div');
        row.className = 'pubview-row';
        title.parentNode.insertBefore(row, title);
        row.appendChild(title);
        row.appendChild(view);
      }
      view.hidden = false;

      var saved = null;
      try { saved = localStorage.getItem(VIEW_KEY); } catch (e) {}
      setView(saved === 'full' ? 'full' : 'brief');

      view.addEventListener('click', function (e) {
        var b = e.target.closest('.pubview__opt');
        if (b) setView(b.dataset.view);
      });

      /* The index scrolls rather than navigates: every paper is on this page. */
      navList.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a) return;
        var card = document.getElementById(a.getAttribute('href').slice(1));
        if (!card) return;
        e.preventDefault();
        e.stopPropagation();
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        Array.prototype.forEach.call(navList.querySelectorAll('a'), function (x) {
          x.classList.toggle('is-active', x === a);
        });
      });
    }

    /* Mark the summaries whose text actually overflows three lines, so the
       fade and the leading ellipsis only appear where something was cut.
       Re-measured on resize, since the line count depends on column width. */
    function markClipped() {
      Array.prototype.forEach.call(list.querySelectorAll('.pub__summary'), function (su) {
        var p = su.querySelector('.pub__excerpt');
        if (!p) return;
        su.classList.remove('pub__summary--clipped');
        if (p.scrollHeight > su.clientHeight + 1) {
          su.classList.add('pub__summary--clipped');
        }
      });
    }
    markClipped();

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(markClipped, 150);
    });

    /* Regrouping and filtering move cards about but never change their
       widths, so only a resize can change what is clipped. */

    /* Clicking anywhere on a card opens that paper. It forwards to the title
       link rather than navigating itself, so soft navigation handles it like
       any other link and the behaviour stays in one place.

       Done in script rather than by stretching the title link over the card
       with a pseudo-element: that technique makes the card's text impossible
       to select, and titles and author lists on this page get copied. */
    list.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var card = e.target.closest('.pub');
      if (!card) return;
      if (e.target.closest('a, button, input, summary')) return;
      if (String(window.getSelection())) return;
      var link = card.querySelector('.pub__title a');
      if (link) link.click();
    });
    /* Draw once on load. The order is unchanged - Liquid already rendered the
       list newest-first - but it populates the jump index and sets
       data-group, so switching to Abstracts works before any sort is used. */
    draw('date', '');
    markClipped();
  }

  window.pubListInit = init;
  init();
})();
</script>
